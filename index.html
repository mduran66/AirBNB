<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Encuesta</title>

<style>
body {
  font-family: sans-serif;
  background: #fff;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

.progress {
  height: 6px;
  background: #eee;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #ff385c;
  transition: width .3s;
}

button {
  padding: 12px;
  margin-top: 10px;
  width: 100%;
  border-radius: 10px;
  border: 1px solid #ddd;
  background: white;
  cursor: pointer;
}

button.selected {
  border-color: #ff385c;
  background: #fff1f3;
}

textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<img src="perfil.png" width="60" style="border-radius:50%">

<h2 id="question"></h2>

<div class="progress">
  <div class="progress-bar" id="bar"></div>
</div>

<div id="options"></div>

<button id="next" disabled>Continuar</button>

</div>

<script>

const ENDPOINT = "TU_URL_APPS_SCRIPT_AQUI";

const questions = [

{
  id:"estadiascore",
  title:"¿Cómo calificarías tu estadía?",
  type:"stars"
},

{
  id:"sueno",
  title:"¿Cómo dormiste durante tu estadía?",
  type:"choice",
  options:[
    "Dormí muy bien todas las noches",
    "Dormí bien en general",
    "Algunas noches no dormí bien",
    "Dormí mal la mayoría de las noches"
  ]
},

{
  id:"sueno_influencia",
  title:"¿Creés que algo del departamento influyó?",
  type:"choice",
  depends:"sueno",
  showIf:["Algunas noches no dormí bien","Dormí mal la mayoría de las noches"],
  options:[
    "Sí, definitivamente",
    "Puede ser",
    "No, fue por otros factores"
  ]
},

{
  id:"cowork",
  title:"¿Tu productividad fue similar a estar en tu casa?",
  type:"choice",
  options:[
    "Si, la misma productividad",
    "Similar, suficiente",
    "Bien, con distracciones",
    "Aceptable"
  ]
},

{
  id:"limpieza",
  title:"¿Cómo evaluás la limpieza?",
  type:"stars"
},

{
  id:"comida",
  title:"¿Qué opinás de la variedad de comida?",
  type:"text"
},

{
  id:"mejora",
  title:"¿Qué mejorarías?",
  type:"text"
},

{
  id:"noideal",
  title:"¿Algo no ideal?",
  type:"text"
},

{
  id:"encasa",
  title:"¿Cuándo te sentiste más en casa?",
  type:"text"
},

{
  id:"balance",
  title:"¿Qué ajustarías en una próxima visita?",
  type:"choice",
  options:[
    "Más planes afuera",
    "Más planes tranquilos",
    "Mantener igual"
  ]
},

{
  id:"anfitrion",
  title:"¿Cómo fue tu experiencia conmigo?",
  type:"text"
}

];

let i = 0;
let answers = {};

const q = document.getElementById("question");
const opts = document.getElementById("options");
const next = document.getElementById("next");
const bar = document.getElementById("bar");

function render(){

  let current = questions[i];

  // skip condicional
  if(current.depends){
    if(!current.showIf.includes(answers[current.depends])){
      i++;
      return render();
    }
  }

  q.innerText = current.title;
  opts.innerHTML = "";
  next.disabled = true;

  bar.style.width = ((i)/questions.length)*100 + "%";

  if(current.type==="choice"){
    current.options.forEach(o=>{
      let b = document.createElement("button");
      b.innerText = o;
      b.onclick = ()=>{
        answers[current.id] = o;
        [...opts.children].forEach(c=>c.classList.remove("selected"));
        b.classList.add("selected");
        next.disabled=false;
      };
      opts.appendChild(b);
    });
  }

  if(current.type==="text"){
    let t = document.createElement("textarea");
    t.oninput=()=>{
      answers[current.id]=t.value;
      next.disabled=false;
    };
    opts.appendChild(t);
  }

  if(current.type==="stars"){
    for(let s=1;s<=5;s++){
      let b = document.createElement("button");
      b.innerText = "⭐".repeat(s);
      b.onclick=()=>{
        answers[current.id]=s;
        next.disabled=false;
      };
      opts.appendChild(b);
    }
  }
}

next.onclick = async ()=>{
  i++;

  if(i>=questions.length){
    await send();
    alert("Listo ❤️");
    return;
  }

  render();
};

async function send(){

  const payload = {
    submitted_at: new Date().toISOString(),
    source: "encuesta-airbnb",
    sheet_name: "Encuesta_Mayo",
    calificacion_estadia: answers.estadiascore,
    comentario_estadia: "",
    sueno_general: answers.sueno,
    sueno_influyo_departamento: answers.sueno_influencia,
    sueno_detalle: "",
    productividad_hogar: answers.cowork,
    limpieza: answers.limpieza,
    variedad_comida: answers.comida,
    mejora_departamento: answers.mejora,
    algo_no_ideal: answers.noideal,
    momento_mas_en_casa: answers.encasa,
    balance_actividades: answers.balance,
    repetiria: "",
    review_anfitrion: answers.anfitrion
  };

  await fetch(ENDPOINT, {
    method:"POST",
    body: new URLSearchParams(payload)
  });

}

render();

</script>

</body>
</html>
